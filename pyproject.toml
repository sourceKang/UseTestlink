[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testlink-agent"
version = "1.7.0"
description = "TestLink XML-RPC helper with CLI and MCP server entrypoints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
testlink-agent = "testlink_agent_core.cli:main"
testlink-agent-mcp = "testlink_agent_core.server:main"
testlink-mcp = "testlink_mcp.server:main"
redmine-mcp = "redmine_mcp.server:main"
qa-integration-agent-mcp = "qa_integration_agent.server:main"

[tool.setuptools]
packages = [
  "qa_mcp_contracts",
  "qa_integration_agent",
  "redmine_mcp",
  "testlink_agent_core",
  "testlink_agent_core.handlers",
  "testlink_agent_core.tools",
  "testlink_mcp",
]
